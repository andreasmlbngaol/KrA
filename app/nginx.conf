# Production nginx for the KrA web client.
#  - Serves the built SPA and reverse-proxies /api/ to the Spring "server" service.
#  - Streaming-safe: /api/ proxying disables buffering and uses long timeouts so
#    the chat streaming endpoint (POST /api/agent/chat/stream, NDJSON) flushes
#    events to the browser in real time. Without it nginx would buffer the whole
#    response and the stream would appear frozen until completion.
#  - gzip for text assets + long-lived immutable caching for hashed build files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-like responses (helps JS/CSS/HTML/JSON over the wire).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Forward API calls to the Spring server (the "server" service in compose).
    location /api/ {
        proxy_pass http://server:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clear Connection so keep-alive to the upstream is reused (HTTP/1.1).
        proxy_set_header Connection "";

        # --- Streaming (NDJSON) support ---
        # Do NOT buffer so streamed chat events reach the client immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # First token can lag (LLM cold start) and a stream may stay open for
        # minutes; keep the upstream connection alive long enough.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Fingerprinted build assets (Vite emits hashed filenames) -> cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback so client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
