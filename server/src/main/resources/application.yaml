spring:
  application:
    name: server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/krs_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

agent:
  openrouter-api-key: ${OPENROUTER_API_KEY:}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me}
  issuer: ${JWT_ISSUER:krs-server}
  audience: ${JWT_AUDIENCE:krs-client}
  realm: ${JWT_REALM:krs-agent}
  access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
  refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}
  # Set true in production (HTTPS) so the refresh-token cookie is Secure-only.
  cookie-secure: ${JWT_COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    mappings:
      enabled: true
