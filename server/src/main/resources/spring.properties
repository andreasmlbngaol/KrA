# Spring Framework 7.0.6+ wraps ServerHttpResponse.getBody() in a non-flushing
# stream by default (see ServletServerHttpResponse#FLUSH_ENABLED_PROPERTY_NAME).
# StreamingResponseBody writes through that wrapper, so out.flush() in
# AgentController#chatStream became a no-op and the whole NDJSON reply was
# buffered until the agent finished. Re-enable flushing so each step event is
# delivered to the browser as soon as it is produced.
spring.http.response.flush.enabled=true
