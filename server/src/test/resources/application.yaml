# Test profile: in-memory H2 so the Spring context loads without PostgreSQL.
# Flyway is disabled here because the migrations target PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:kra_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
