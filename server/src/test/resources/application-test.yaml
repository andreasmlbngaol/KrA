# Test profile: in-memory H2 so the Spring context loads without PostgreSQL.
# Flyway is disabled here because the migrations target PostgreSQL; Hibernate creates
# the schema from the entities instead. Merged on top of the main application.yaml.
spring:
  datasource:
    # NON_KEYWORDS: `year` and `day` are reserved words in H2 (not in PostgreSQL).
    url: jdbc:h2:mem:kra_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=YEAR,DAY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

# Dummy key so the KrsAgent bean can be constructed in tests (no LLM calls are made).
agent:
  google-api-key: test-key
